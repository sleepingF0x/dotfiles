# Shared ssh defaults, synced via dotfiles. Do not add host entries here.
#
# AddKeysToAgent hands the decrypted key to ssh-agent on first use, so a
# passphrase is typed once instead of on every connection. UseKeychain (macOS)
# persists it across reboots; IgnoreUnknown makes Linux, WSL and Git Bash skip
# that line rather than fail to parse the config.
Host *
    IgnoreUnknown UseKeychain
    AddKeysToAgent yes
    UseKeychain yes
